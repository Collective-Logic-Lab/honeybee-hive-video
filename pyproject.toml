[project]
name = "hive-video"
version = "0.1.0"
description = "Portable download, resequencing, and fragment tools for honey bee hive video."
requires-python = ">=3.12"
dependencies = ["certifi>=2026.4.22", "filelock>=3.20", "portable-ffmpeg==0.3.0"]

[project.optional-dependencies]
resequence = [
    "numpy>=1.26",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
]

[project.scripts]
hive-video = "hive_video.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_video"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "src/hive_video"]

[dependency-groups]
dev = [
    "ruff>=0.5",
]
research = [
    "certifi>=2026.4.22",
    "hf>=1.14.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2",
    "pillow>=12.2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[tool.uv]
default-groups = ["dev", "research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "NPY",  # NumPy-specific rules
]
ignore = [
    "E501", # Do not enforce line length (supports unwrapped prose in comments/docstrings)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["F401", "F841"]
"experiments/**" = ["E402"]
